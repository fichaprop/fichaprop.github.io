<!DOCTYPE html>

  <style>
  :root {

  }

  .sub { color: var(--sub); font-size: .93rem; }
  .tag { display: inline-block; background: var(--acc2); color: var(--acc); border-radius: 999px; padding: 3px 11px; font-size: .78rem; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: .87rem; background: #fff; }
  .btn {
    appearance: none; border: 0; border-radius: 10px; background: var(--acc); color: #fff; font: inherit; font-weight: 600;
    padding: 11px 16px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn.sec { background: var(--acc2); color: var(--acc); }
  .btn.peq { padding: 7px 11px; font-size: .85rem; border-radius: 8px; }
  .btn:disabled { opacity: .5; cursor: default; }
  input[type=text], input[type=search], select {
    font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; width: 100%; color: var(--txt);
  }
  input:focus, select:focus { outline: 2px solid var(--acc); outline-offset: -1px; }
  .vacio { text-align: center; color: var(--sub); padding: 40px 0; }
</style>  <style>
    header { padding: 22px 0 6px; }

    .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 14px; margin: 16px 0 32px; }
    .item { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
    .item:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.07); }
    .thumb { aspect-ratio: 4 / 3; overflow: hidden; background: #ddd; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb.recorte img { transform: scale(1.2); }
    .cuerpo { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; }
    .t { font-weight: 600; line-height: 1.3; }

const L = D.fichas || [];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const miles = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const sinAcento = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const $ = id => document.getElementById(id);

function opciones(sel, campo) {
  [...new Set(L.map(f => f[campo]).filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b)))
    .forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; $(sel).appendChild(o); });
}
opciones('op', 'operacion'); opciones('tipo', 'tipo'); opciones('barrio', 'barrio');

function render() {
  const q = sinAcento($('q').value).trim();
  const op = $('op').value, tipo = $('tipo').value, barrio = $('barrio').value, dorm = Number($('dorm').value);
  let r = L.filter(f =>
    (!op || f.operacion === op) && (!tipo || f.tipo === tipo) && (!barrio || f.barrio === barrio) &&
    (!dorm || Number(f.dormitorios) >= dorm) &&
    (!q || sinAcento([f.titulo, f.barrio, f.zona, f.tipo, f.operacion].join(' ')).includes(q)));
  const o = $('orden').value;
  if (o !== 'rec') r = r.slice().sort((a, b) => ((Number(a.precio) || 9e15) - (Number(b.precio) || 9e15)) * (o === 'pa' ? 1 : -1));

  $('total').textContent = r.length + (r.length === 1 ? ' propiedad' : ' propiedades');
  $('grilla').innerHTML = r.length ? r.map(f => `
    <a class="item" href="${D.urlBase}?f=${encodeURIComponent(f.slug)}">
      <div class="thumb${f.recorte ? ' recorte' : ''}">${f.portadaId ? `<img src="https://drive.google.com/thumbnail?id=${f.portadaId}&sz=w640" loading="lazy" alt="">` : ''}</div>
