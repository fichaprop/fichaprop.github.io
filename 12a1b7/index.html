<script>
const D = {"ficha":{"slug":"casa-venta-echeverria-del-lago-12a1b7","titulo":"Casa en Venta en Echeverria Del Lago","tipo":"Casa","operacion":"Venta","precio":{"moneda":"USD","monto":280000},"expensas":{"moneda":"ARS","monto":500000},"ubicacion":{"barrio":"Echeverria Del Lago","zona":"Echeverria Del Lago, Countries/B.Cerrado (E. Echeverría), Esteban Echeverria, G.B.A. Zona Sur","lat":-34.888,"lng":-58.489},"descripcion":"Casa de 6 ambientes con pileta y parrilla en venta en el Barrio privado \"Echeverria del lago\"\nPlanta baja y exterior:\n-Hall de ingreso\n-Amplio living comedor\n- Cocina integrada con isla\n- Dormitorio con placard\n-Baño completo\n-Quincho de 12 x 4.50 con parrilla\n- Jardín con pileta de 9 x 4.50\n-Toilette\n\nPlanta alta:\n- 3 dormitorios con placard\n- 1 Suite principal con vestidor\n- 2 baños completos\n\nAdicionales:\n-Aire acondicionado frio/calor en todos los ambientes\n- Espacio de estacionamiento para 4 autos\nAcepta permuta por vehículo o propiedad de menor valor\n\nEcheverría del Lago cuenta con Club House con restaurante, canchas de tenis, cancha de fútbol, cancha de hockey, gimnasio, SUM, despensa, piscina semi olímpica, piscina de niños, actividades deportivas para adultos y niños, colonia en verano y seguridad 24 hs.","detalles":[["Sup. Total","348 m²"],["Sup. del Terreno","800 m²"],["Tipo","Casa"],["Ambientes","6"],["Dormitorios","5"],["Baños","3"],["Toilettes","1"],["Cocheras","4"],["Plantas","2"],["Antigüedad","15 años"],["Orientación","Norte"],["Frente","40 mts"],["Fondo","20 mts"],["Estado","Excelente"],["Situación","Habitada"],["Apto crédito","Sí"]],"servicios":["Agua Corriente","Gas Natural","Internet","Electricidad","Pavimento","Cable","Alumbrado público","Biodigestor","TV por Satélite","Red de desagües pluviales"],"comodidades":["Aire Acondicionado individual","Centro de deportes","Gimnasio","Parrilla","Quincho","Solarium","SUM","Seguridad","Apto mascotas","Lote Interno","Pileta","Estilo Moderno","Seguridad Privada","Ubicación tranquila","Zona de parrillas","Restaurante","Chimenea","Calefacción por aire","Seguridad nocturna","Club House","Seguridad 24hs","Seguridad de día","Zonas Verdes","Escritura inmediata","Cancha de Tenis","Parrilla techada","Calefacción F/C","Lavandería","Amenities","Barrio privado","Permuta"],"fotos":[{"id":"1TBEUncD0n4EgDANGl8TFpVBFFfpnKatq","recorte":false},{"id":"1L_4wiS_kVl5sAiLksq1dH1CGp47VV2Tz","recorte":false},{"id":"1CTYd42X4KlSyyZWofsT3cr_9Z4-ATV9R","recorte":false},{"id":"1sWRamO1EVqJB_gF6sGZBhb4FGBtCuvxM","recorte":false},{"id":"1O2PRcGaPswknI8JTz3-sZVqIuMEF9X6X","recorte":false},{"id":"1rYH9xGpFPrDKLDI1nNEd_qJJcpiK3DIw","recorte":false},{"id":"1ORcyLQRQ1dRkSjzU5EDZq78Oh9JFa64i","recorte":false},{"id":"1omENQIXeoQflUApCJ-8TN9yqgPpI14K4","recorte":false},{"id":"1N4nZaszDhDDTJXLR8hzK_YzKT2nPfGG1","recorte":false},{"id":"1jAkEI5BkJ1r27jdm_CRVycysEOEpIdV3","recorte":false},{"id":"1orR0S7asO_AQ3yKiu_Oe8kjDd5PBW4TO","recorte":false},{"id":"1AEk3pFCvG8Gr77teVasWM-4RXgRL64Ky","recorte":false},{"id":"16yvHVs9lhvpHNdKrzyIovLGP96wWyH5H","recorte":false},{"id":"1bTvVL4x3Arb0XEeItb816MFaNlMTBAq1","recorte":false},{"id":"1cOJV_sTpnQUPRypX1fx8irz7A35XSGk7","recorte":false},{"id":"1YmcFEzqsH78f8noKdl9Rpva_w9IjB8bv","recorte":false},{"id":"1OBrm5w4Ak5FkC-cyR_D7bnOtK7pPRWGW","recorte":false},{"id":"1XVrB3TLySliUFPdd9v-AG5MZ7SUprX3k","recorte":false},{"id":"1rqaHlafGFUiJCrGHZ0sR9ZKwHP0lenth","recorte":false},{"id":"1ZKIHer2-j88TqNefbPG-wDCMo_qmeU0E","recorte":false},{"id":"14kIjrm3WqJrKJnFaTZltREi4G7NQeOYD","recorte":false},{"id":"1egA3_C5ijUMouDfiXvWkap6-6hC4jlEn","recorte":false},{"id":"1hpzCTOyP9KpJhnNqtBNG-UuoyuOb_Nzf","recorte":false},{"id":"1toMQ2NJEH_-1hks6RKlWUW7NBEplxEzO","recorte":false},{"id":"1ArhB2AhFD3rb2A5yrVpR1tpJTPQ7RCwi","recorte":false},{"id":"1Qd4ZY3IhaK_yPYJ8rzKk1_1k_aftA0rV","recorte":false},{"id":"1Of-GoMPTYHlvT5qOhYnGukIqXm86Lyf_","recorte":false}],"planos":[],"actualizado":"2026-10-09T14:07:12.093Z"},"urlFicha":"https://fichaprop.github.io/12a1b7/","urlIndice":"https://fichaprop.github.io/","mostrarIndice":true,"avisoLegal":"Toda la información suministrada en forma de imágenes y/o escrita carece de valor contractual y deberá ser corroborada por el interesado."};
const F = D.ficha;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const miles = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const plata = p => p && p.monto ? (p.moneda === 'USD' ? 'USD ' : '$ ') + miles(p.monto) : 'Consultar';
const img = (id, w) => 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + (w || 1600);
const urlFicha = D.urlFicha;
const detalle = re => { const d = (F.detalles || []).find(x => re.test(x[0])); return d ? d[1] : ''; };

function render() {
  const fotos = F.fotos || [];
  const u = F.ubicacion || {};
  const lugar = [u.barrio, u.zona && u.zona !== u.barrio ? u.zona.replace(u.barrio + ', ', '') : ''].filter(Boolean).join(' · ');

  const stats = [
    [detalle(/total/i), 'totales'],
    [detalle(/cubierta/i), 'cubiertos'],
    [detalle(/^amb/i), 'ambientes'],
    [detalle(/^dorm/i), 'dormitorios'],
    [detalle(/^bañ/i), 'baños'],
    [detalle(/^coch|^garage/i), 'cocheras']
  ].filter(s => s[0]).map(s => `<div class="stat"><b>${esc(String(s[0]).replace(' m²', ''))}${/m²/.test(s[0]) ? '<small> m²</small>' : ''}</b><span>${s[1]}</span></div>`).join('');

  const seccion = (titulo, cuerpo) => cuerpo ? `<div class="card"><h2>${titulo}</h2>${cuerpo}</div>` : '';
  const chips = arr => arr && arr.length ? `<div class="chips">${arr.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : '';

  let mapa = '';
  if (u.lat && u.lng) {
    const b = [u.lng - 0.012, u.lat - 0.008, u.lng + 0.012, u.lat + 0.008].join(',');
    mapa = `<iframe class="mapa" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${b}&layer=mapnik"></iframe>
            <div class="sub" style="margin-top:6px">Ubicación aproximada.</div>`;
  }

  document.getElementById('app').innerHTML = `
    <div class="wrap" style="padding:0">
      <div class="gal">
        <div class="track" id="track">
          ${fotos.map((f, i) => `<div class="slide${f.recorte ? ' recorte' : ''}" data-i="${i}"><img src="${img(f.id)}" alt="Foto ${i + 1}" loading="${i < 2 ? 'eager' : 'lazy'}"></div>`).join('')}
        </div>
        ${fotos.length > 1 ? `<button class="nav prev" id="prev" aria-label="Anterior">‹</button><button class="nav next" id="next" aria-label="Siguiente">›</button>` : ''}
        <div class="count" id="count">1 / ${fotos.length}</div>
      </div>
    </div>
    <div class="wrap">
      <div class="card">
        <span class="tag">${esc([F.tipo, F.operacion].filter(Boolean).join(' · ') || 'Propiedad')}</span>
        <h1>${esc(F.titulo)}</h1>
        ${lugar ? `<div class="sub">${esc(lugar)}</div>` : ''}
        <div class="precio">${plata(F.precio)}</div>
        ${F.expensas ? `<div class="sub">Expensas: ${plata(F.expensas)}</div>` : ''}
        ${stats ? `<div class="stats">${stats}</div>` : ''}
      </div>
      ${seccion('Descripción', (F.descripcion ? `<div class="desc" id="desc">${esc(F.descripcion)}</div><button class="mas" id="mas" hidden>Leer más</button>` : '') + (D.avisoLegal ? `<div class="legal">${esc(D.avisoLegal)}</div>` : ''))}
      ${seccion('Detalles', (F.detalles || []).length ? `<div class="det">${F.detalles.map(d => `<div><span>${esc(d[0])}</span><span>${esc(d[1])}</span></div>`).join('')}</div>` : '')}
      ${seccion('Servicios', chips(F.servicios))}
      ${seccion('Comodidades', chips(F.comodidades))}
      ${seccion('Ubicación', mapa)}
      ${seccion('Planos', (F.planos || []).length ? `<div class="planos">${F.planos.map(id => `<a href="${img(id, 2400)}" target="_blank"><img src="${img(id, 600)}" alt="Plano"></a>`).join('')}</div>` : '')}
    </div>
    <div class="barra"><div class="wrap">
      <button class="btn" id="compartir">Compartir</button>
      ${D.mostrarIndice ? `<a class="btn sec" href="${D.urlIndice}">Más propiedades</a>` : ''}
    </div></div>`;

  // Galería
  const track = document.getElementById('track');
  const count = document.getElementById('count');
  const actual = () => Math.round(track.scrollLeft / track.clientWidth);
  track.addEventListener('scroll', () => { count.textContent = (actual() + 1) + ' / ' + fotos.length; }, { passive: true });
  const mover = d => track.scrollTo({ left: (actual() + d) * track.clientWidth, behavior: 'smooth' });
  if (fotos.length > 1) {
    document.getElementById('prev').onclick = () => mover(-1);
    document.getElementById('next').onclick = () => mover(1);
  }
  track.addEventListener('click', e => { const s = e.target.closest('.slide'); if (s) abrirLb(Number(s.dataset.i)); });

  // Descripción
  const desc = document.getElementById('desc');
  if (desc) {
    desc.classList.add('corta');
    const mas = document.getElementById('mas');
    if (desc.scrollHeight > desc.clientHeight + 10) {
      mas.hidden = false;
      mas.onclick = () => { const c = desc.classList.toggle('corta'); mas.textContent = c ? 'Leer más' : 'Leer menos'; };
    } else desc.classList.remove('corta');
  }

  // Compartir
  document.getElementById('compartir').onclick = async () => {
    try { if (navigator.share) { await navigator.share({ title: F.titulo, url: urlFicha }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    window.open('https://wa.me/?text=' + encodeURIComponent(F.titulo + ' ' + urlFicha), '_blank');
  };
}

// Visor a pantalla completa
let lbI = 0;
const lb = document.getElementById('lb');
function abrirLb(i) {
  const fotos = F.fotos || [];
  lbI = (i + fotos.length) % fotos.length;
  const f = fotos[lbI];
  const im = document.getElementById('lbImg');
  im.src = img(f.id, 2400);
  im.style.clipPath = f.recorte ? 'inset(8.3%)' : '';
  document.getElementById('lbCount').textContent = (lbI + 1) + ' / ' + fotos.length;
  lb.classList.add('on');
}
document.getElementById('lbPrev').onclick = e => { e.stopPropagation(); abrirLb(lbI - 1); };
document.getElementById('lbNext').onclick = e => { e.stopPropagation(); abrirLb(lbI + 1); };
document.getElementById('lbCerrar').onclick = () => lb.classList.remove('on');
lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('on'); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') lb.classList.remove('on');
  if (e.key === 'ArrowLeft') abrirLb(lbI - 1);
  if (e.key === 'ArrowRight') abrirLb(lbI + 1);
});
let x0 = null;
lb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
lb.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 40) abrirLb(lbI + (dx < 0 ? 1 : -1));
  x0 = null;
});

render();
</script>
